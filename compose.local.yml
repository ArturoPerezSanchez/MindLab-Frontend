name: mindora-local

services:
  backend:
    build:
      context: ../backend
    environment:
      MINDORA_ENV: development
      MINDORA_TOKEN_SECRET: mindora-compose-development-secret-change-for-production
      MINDORA_USERS_DB: /app/data/mindora_users.sqlite3
      MINDORA_FRONTEND_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      MINDORA_ALLOWED_HOSTS: 127.0.0.1,localhost
      MINDORA_ENABLE_LEGACY_ROUTES: "0"
      # The API is reachable only through the trusted frontend container.
      MINDORA_TRUST_PROXY: "1"
    volumes:
      # /app/data is owned by the non-root image user and contains the checked
      # MiniChess catalog; Docker initializes the volume from that directory.
      - mindora-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  mindora-data:
