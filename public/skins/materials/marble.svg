<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!--
    Polished marble: a broad sheen across the face, fine veining, and a gold
    hairline inset just in from the edge. Neutral apart from the gold, which is
    faint enough to warm any region colour rather than recolour it.
  -->
  <defs>
    <linearGradient id="regaliaSheen" x1="6%" y1="0%" x2="94%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#regaliaSheen)"/>

  <!-- Veining. Two weights: a few structural veins, then hairlines off them. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#ffffff" opacity="0.30">
      <path d="M-4 26 C 18 16, 34 34, 52 24 S 84 12, 104 22" stroke-width="2.1"/>
      <path d="M-4 71 C 20 63, 32 79, 55 70 S 86 62, 104 68" stroke-width="1.7"/>
    </g>
    <g stroke="#000000" opacity="0.14">
      <path d="M-4 28.6 C 18 18.6, 34 36.6, 52 26.6 S 84 14.6, 104 24.6" stroke-width="1.1"/>
      <path d="M-4 73.4 C 20 65.4, 32 81.4, 55 72.4 S 86 64.4, 104 70.4" stroke-width="0.9"/>
      <path d="M14 4 C 20 22, 12 34, 20 48 S 14 74, 22 96" stroke-width="0.7"/>
      <path d="M76 2 C 70 20, 82 32, 74 46 S 84 72, 78 98" stroke-width="0.6"/>
      <path d="M44 34 C 50 44, 42 52, 48 62" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Gold inlay, held off the edge so region borders still read cleanly. -->
  <rect x="6" y="6" width="88" height="88" fill="none" stroke="#d8b25a" stroke-opacity="0.55" stroke-width="1.4"/>
  <rect x="9" y="9" width="82" height="82" fill="none" stroke="#f0dCA0" stroke-opacity="0.30" stroke-width="0.7"/>
  <g fill="#d8b25a" opacity="0.5">
    <circle cx="6" cy="6" r="2.1"/>
    <circle cx="94" cy="6" r="2.1"/>
    <circle cx="6" cy="94" r="2.1"/>
    <circle cx="94" cy="94" r="2.1"/>
  </g>
</svg>
