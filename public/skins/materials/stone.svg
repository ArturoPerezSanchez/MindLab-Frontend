<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!--
    Chiselled stone. A soft top-left light, a pitted face, and a few chisel
    fractures. All neutral so the region colour still comes through as the
    stone's own hue.
  -->
  <defs>
    <radialGradient id="quarryLight" cx="28%" cy="24%" r="86%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.26"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#quarryLight)"/>

  <!-- Pitting. Irregular on purpose; a regular grid reads as fabric, not rock. -->
  <g fill="#000000" opacity="0.13">
    <ellipse cx="18" cy="31" rx="4.2" ry="3.1"/>
    <ellipse cx="63" cy="19" rx="3.1" ry="2.4"/>
    <ellipse cx="41" cy="58" rx="5.1" ry="3.6"/>
    <ellipse cx="79" cy="47" rx="2.8" ry="2.2"/>
    <ellipse cx="27" cy="77" rx="3.6" ry="2.7"/>
    <ellipse cx="69" cy="82" rx="4.4" ry="3.0"/>
    <ellipse cx="88" cy="68" rx="2.3" ry="1.8"/>
    <ellipse cx="52" cy="35" rx="2.1" ry="1.7"/>
  </g>
  <g fill="#ffffff" opacity="0.16">
    <ellipse cx="17" cy="29.4" rx="4.2" ry="2.6"/>
    <ellipse cx="40" cy="56.2" rx="5.1" ry="2.9"/>
    <ellipse cx="68" cy="80.4" rx="4.4" ry="2.4"/>
  </g>

  <!-- Fractures. -->
  <g stroke="#000000" fill="none" opacity="0.17" stroke-linecap="round">
    <path d="M6 14 L23 26 L19 44" stroke-width="1.6"/>
    <path d="M74 8 L83 27 L96 33" stroke-width="1.3"/>
    <path d="M33 92 L45 74 L60 71" stroke-width="1.5"/>
  </g>
  <g stroke="#ffffff" fill="none" opacity="0.14" stroke-linecap="round">
    <path d="M7.4 12.8 L24.4 24.8" stroke-width="1.1"/>
    <path d="M34.4 90.8 L46.4 72.8" stroke-width="1"/>
  </g>

  <!-- Mortar shadow at the cell edge. -->
  <rect x="0.5" y="0.5" width="99" height="99" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="3"/>
  <path d="M2 98 L2 2 L98 2" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>
</svg>
