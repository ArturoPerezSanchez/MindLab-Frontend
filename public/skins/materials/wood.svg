<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!--
    Sawn board face: grain running with the cell, one knot off centre, and a
    brass hairline at the edge. Grain is drawn in neutral darks and lights so
    the region colour supplies the timber's own tone.
  -->
  <defs>
    <linearGradient id="timberLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#timberLight)"/>

  <!-- Grain lines, bending around the knot at (68, 38). -->
  <g fill="none" stroke="#000000" opacity="0.15" stroke-linecap="round">
    <path d="M-4 12 C 26 9, 48 15, 104 11" stroke-width="1.5"/>
    <path d="M-4 24 C 24 21, 46 27, 104 22" stroke-width="1.1"/>
    <path d="M-4 38 C 22 34, 44 41, 58 38 C 64 36, 64 40, 104 37" stroke-width="1.7"/>
    <path d="M-4 52 C 24 49, 44 55, 104 50" stroke-width="1.2"/>
    <path d="M-4 65 C 26 62, 48 68, 104 64" stroke-width="1.5"/>
    <path d="M-4 79 C 22 76, 46 82, 104 77" stroke-width="1"/>
    <path d="M-4 91 C 26 88, 48 94, 104 90" stroke-width="1.4"/>
  </g>
  <g fill="none" stroke="#ffffff" opacity="0.16" stroke-linecap="round">
    <path d="M-4 14 C 26 11, 48 17, 104 13" stroke-width="0.9"/>
    <path d="M-4 40 C 22 36, 44 43, 58 40 C 64 38, 64 42, 104 39" stroke-width="1"/>
    <path d="M-4 67 C 26 64, 48 70, 104 66" stroke-width="0.9"/>
  </g>

  <!-- Knot. -->
  <g fill="none" stroke="#000000" stroke-linecap="round">
    <ellipse cx="68" cy="38" rx="7.5" ry="4.6" opacity="0.20" stroke-width="1.6"/>
    <ellipse cx="68" cy="38" rx="4.4" ry="2.7" opacity="0.24" stroke-width="1.4"/>
    <ellipse cx="68" cy="38" rx="1.7" ry="1.1" opacity="0.28" stroke-width="1.2"/>
  </g>

  <!-- Brass edging. -->
  <rect x="1.5" y="1.5" width="97" height="97" fill="none" stroke="#000000" stroke-opacity="0.24" stroke-width="3"/>
  <rect x="4" y="4" width="92" height="92" fill="none" stroke="#c9a227" stroke-opacity="0.42" stroke-width="1.2"/>
</svg>
