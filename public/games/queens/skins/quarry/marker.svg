<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Wrought iron queen: hammered facets, a pitted body, a lichen-green patina. -->
  <defs>
    <linearGradient id="iron" x1="22%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8b9098"/>
      <stop offset="38%" stop-color="#5a6068"/>
      <stop offset="72%" stop-color="#3a3f46"/>
      <stop offset="100%" stop-color="#23272c"/>
    </linearGradient>
    <linearGradient id="ironBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c727a"/>
      <stop offset="100%" stop-color="#2b2f35"/>
    </linearGradient>
  </defs>

  <!-- Coronet. -->
  <path d="M14 20 L18 9 L23 18 L28 7 L32 4 L36 7 L41 18 L46 9 L50 20 L46 26 L18 26 Z" fill="url(#iron)"/>
  <!-- Body, waisted. -->
  <path d="M18 26 L46 26 C 45 34, 41 38, 39 45 L25 45 C 23 38, 19 34, 18 26 Z" fill="url(#iron)"/>
  <!-- Collar and base. -->
  <rect x="23" y="45" width="18" height="4" rx="1.4" fill="url(#ironBase)"/>
  <path d="M18 51 L46 51 L49 58 L15 58 Z" fill="url(#ironBase)"/>
  <ellipse cx="32" cy="58" rx="17" ry="2.6" fill="#1b1e22"/>

  <!-- Hammered facets. -->
  <g stroke="#aab0b8" stroke-opacity="0.45" fill="none" stroke-linecap="round">
    <path d="M19 21 L23 15" stroke-width="1.6"/>
    <path d="M31 7 L31 20" stroke-width="1.8"/>
    <path d="M44 21 L41 15" stroke-width="1.4"/>
    <path d="M24 29 L27 41" stroke-width="1.5"/>
    <path d="M33 29 L34 41" stroke-width="1.2"/>
  </g>
  <g stroke="#12151a" stroke-opacity="0.55" fill="none" stroke-linecap="round">
    <path d="M40 29 L37 41" stroke-width="1.6"/>
    <path d="M46 22 L43 27" stroke-width="1.3"/>
  </g>

  <!-- Pitting and patina. -->
  <g fill="#0f1215" opacity="0.35">
    <circle cx="27" cy="33" r="1.2"/>
    <circle cx="36" cy="36" r="0.9"/>
    <circle cx="22" cy="23" r="1"/>
    <circle cx="42" cy="33" r="0.8"/>
  </g>
  <g fill="#6f8f6a" opacity="0.5">
    <path d="M20 39 C 23 41, 25 40, 26 43 L 22 44 Z"/>
    <path d="M43 24 C 45 26, 44 28, 46 29 L 47 25 Z"/>
    <circle cx="33" cy="12" r="1.4"/>
  </g>

  <!-- Points, catching the light. -->
  <g fill="#c3c9d1" opacity="0.75">
    <circle cx="32" cy="5.4" r="2"/>
    <circle cx="18" cy="10.2" r="1.6"/>
    <circle cx="46" cy="10.2" r="1.6"/>
  </g>
</svg>
