<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!--
    Turned Staunton queen in walnut: lathe rings, a felted base, and the light
    coming from the upper left to match the board surface.
  -->
  <defs>
    <linearGradient id="walnut" x1="18%" y1="0%" x2="86%" y2="100%">
      <stop offset="0%" stop-color="#b98a58"/>
      <stop offset="26%" stop-color="#8f6134"/>
      <stop offset="66%" stop-color="#63401f"/>
      <stop offset="100%" stop-color="#3d2712"/>
    </linearGradient>
    <linearGradient id="walnutBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9c6c3c"/>
      <stop offset="100%" stop-color="#402a13"/>
    </linearGradient>
  </defs>

  <!-- Coronet. -->
  <path d="M17 19 L20 10 L25 17 L28.5 8 L32 5 L35.5 8 L39 17 L44 10 L47 19 L44 24 L20 24 Z" fill="url(#walnut)"/>
  <!-- Neck and body. -->
  <path d="M20 24 L44 24 L42 29 L22 29 Z" fill="url(#walnut)"/>
  <path d="M23 29 L41 29 C 40 36, 37 40, 36 46 L 28 46 C 27 40, 24 36, 23 29 Z" fill="url(#walnut)"/>
  <!-- Collar. -->
  <rect x="24" y="46" width="16" height="3.4" rx="1.4" fill="url(#walnutBase)"/>
  <!-- Base. -->
  <path d="M20 51 L44 51 L48 58 L16 58 Z" fill="url(#walnutBase)"/>
  <ellipse cx="32" cy="58.4" rx="16" ry="2.4" fill="#2c1c0c"/>
  <ellipse cx="32" cy="59.4" rx="14" ry="1.5" fill="#1d4230" opacity="0.85"/>

  <!-- Lathe rings: a light band above, shadow below, repeated down the turn. -->
  <g stroke-linecap="round" fill="none">
    <path d="M20.6 25.2 H43.4" stroke="#d8ab74" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M21.4 27.4 H42.6" stroke="#31200e" stroke-opacity="0.5" stroke-width="1.1"/>
    <path d="M23.4 30.2 H40.6" stroke="#d8ab74" stroke-opacity="0.45" stroke-width="1.1"/>
    <path d="M24.6 47 H39.4" stroke="#d8ab74" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M24.6 48.9 H39.4" stroke="#31200e" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M20.4 52.2 H43.6" stroke="#d8ab74" stroke-opacity="0.4" stroke-width="1.1"/>
  </g>

  <!-- Grain on the body. -->
  <g fill="none" stroke="#31200e" stroke-opacity="0.28" stroke-linecap="round">
    <path d="M27 31 C 28 36, 29 40, 29.6 45" stroke-width="1"/>
    <path d="M33 31 C 34 36, 34.6 40, 35 45" stroke-width="0.8"/>
  </g>
  <path d="M25.6 31 C 26.6 36, 27.4 40, 28 45" fill="none" stroke="#d8ab74" stroke-opacity="0.3" stroke-width="0.9"/>

  <!-- Highlight down the lit side. -->
  <path d="M22.4 25 C 23.4 33, 25.6 39, 26.6 45" fill="none" stroke="#e6c093" stroke-opacity="0.4" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="#e6c093" opacity="0.55">
    <circle cx="32" cy="6.4" r="1.7"/>
    <circle cx="20" cy="11" r="1.3"/>
    <circle cx="44" cy="11" r="1.3"/>
  </g>
</svg>
