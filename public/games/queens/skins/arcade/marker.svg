<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <!--
    A crown on a 16x16 grid, drawn as whole pixels. The intrinsic size is 256
    rather than 16 because PixiJS rasterises an SVG once at its declared size:
    at 16 the texture would be upscaled to the cell and lose every hard edge,
    which is the entire point of the skin. crispEdges keeps the 16x upscale
    blocky rather than smoothed.
  -->
  <g fill="#3a2b12">
    <rect x="2" y="3" width="1" height="1"/><rect x="7" y="1" width="2" height="1"/><rect x="13" y="3" width="1" height="1"/>
    <rect x="1" y="4" width="1" height="4"/><rect x="14" y="4" width="1" height="4"/>
    <rect x="6" y="2" width="1" height="2"/><rect x="9" y="2" width="1" height="2"/>
    <rect x="2" y="8" width="12" height="1"/>
    <rect x="2" y="12" width="12" height="1"/>
    <rect x="1" y="9" width="1" height="3"/><rect x="14" y="9" width="1" height="3"/>
  </g>
  <g fill="#f4c542">
    <rect x="2" y="4" width="1" height="4"/>
    <rect x="3" y="5" width="1" height="3"/>
    <rect x="4" y="6" width="1" height="2"/>
    <rect x="5" y="5" width="1" height="3"/>
    <rect x="6" y="4" width="1" height="4"/>
    <rect x="7" y="2" width="2" height="6"/>
    <rect x="9" y="4" width="1" height="4"/>
    <rect x="10" y="5" width="1" height="3"/>
    <rect x="11" y="6" width="1" height="2"/>
    <rect x="12" y="5" width="1" height="3"/>
    <rect x="13" y="4" width="1" height="4"/>
    <rect x="2" y="9" width="12" height="3"/>
  </g>
  <g fill="#fff2b8">
    <rect x="2" y="4" width="1" height="2"/>
    <rect x="7" y="2" width="1" height="3"/>
    <rect x="2" y="9" width="11" height="1"/>
  </g>
  <g fill="#c8921c">
    <rect x="13" y="6" width="1" height="2"/>
    <rect x="2" y="11" width="12" height="1"/>
    <rect x="8" y="5" width="1" height="3"/>
  </g>
  <g fill="#e05a5a">
    <rect x="4" y="10" width="1" height="1"/>
    <rect x="11" y="10" width="1" height="1"/>
  </g>
  <g fill="#5ab4e0">
    <rect x="7" y="10" width="2" height="1"/>
  </g>
</svg>
