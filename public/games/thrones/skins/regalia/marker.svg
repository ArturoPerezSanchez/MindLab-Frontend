<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!--
    Filigree coronet: a gold band with scrollwork, five jewelled points, and a
    velvet cap showing between the arches.
  -->
  <defs>
    <linearGradient id="gold" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa8"/>
      <stop offset="30%" stop-color="#e8c264"/>
      <stop offset="62%" stop-color="#c1912f"/>
      <stop offset="100%" stop-color="#8c6417"/>
    </linearGradient>
    <linearGradient id="band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedb4"/>
      <stop offset="45%" stop-color="#dcb356"/>
      <stop offset="100%" stop-color="#8f6819"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7d1f3d"/>
      <stop offset="100%" stop-color="#4a0f24"/>
    </linearGradient>
  </defs>

  <!-- Cap behind the arches. -->
  <path d="M14 40 C 14 22, 50 22, 50 40 Z" fill="url(#velvet)"/>
  <path d="M18 34 C 24 27, 40 27, 46 34" fill="none" stroke="#a53455" stroke-opacity="0.55" stroke-width="1.6"/>

  <!-- Arches. -->
  <path d="M12 41 C 13 24, 22 14, 32 12 C 42 14, 51 24, 52 41 L 46 41 C 45 27, 39 19, 32 17 C 25 19, 19 27, 18 41 Z" fill="url(#gold)"/>
  <!-- Points. -->
  <path d="M12 41 L9 18 L18 30 Z" fill="url(#gold)"/>
  <path d="M52 41 L55 18 L46 30 Z" fill="url(#gold)"/>
  <path d="M32 12 L32 3 L36 9 Z" fill="url(#gold)"/>

  <!-- Scrollwork on the arch faces. -->
  <g fill="none" stroke="#8c6417" stroke-opacity="0.6" stroke-linecap="round">
    <path d="M21 34 C 24 30, 26 33, 24 36" stroke-width="1.3"/>
    <path d="M43 34 C 40 30, 38 33, 40 36" stroke-width="1.3"/>
    <path d="M28 21 C 31 19, 33 19, 36 21" stroke-width="1.1"/>
  </g>
  <g fill="none" stroke="#fff3c8" stroke-opacity="0.65" stroke-linecap="round">
    <path d="M15 36 C 16 28, 20 21, 26 17" stroke-width="1.4"/>
    <path d="M11 24 L 13 34" stroke-width="1.1"/>
  </g>

  <!-- Band. -->
  <rect x="9" y="41" width="46" height="11" rx="3.2" fill="url(#band)"/>
  <rect x="9" y="41" width="46" height="3" rx="1.5" fill="#fff3c8" fill-opacity="0.55"/>
  <rect x="9" y="49" width="46" height="3" rx="1.5" fill="#6f4d11" fill-opacity="0.45"/>
  <g fill="none" stroke="#8c6417" stroke-opacity="0.5" stroke-width="1">
    <path d="M16 46.5 h32"/>
  </g>

  <!-- Jewels: band and points. -->
  <g>
    <circle cx="20" cy="46.5" r="3" fill="#3f7fd0"/>
    <circle cx="19.1" cy="45.4" r="1.1" fill="#bcd8ff" fill-opacity="0.9"/>
    <circle cx="32" cy="46.5" r="3.6" fill="#c0344f"/>
    <circle cx="30.9" cy="45.2" r="1.3" fill="#ffc7cf" fill-opacity="0.9"/>
    <circle cx="44" cy="46.5" r="3" fill="#2f9469"/>
    <circle cx="43.1" cy="45.4" r="1.1" fill="#b6f0d5" fill-opacity="0.9"/>
  </g>
  <g>
    <circle cx="32" cy="10" r="2.8" fill="#c0344f"/>
    <circle cx="31.1" cy="9" r="1" fill="#ffd0d8" fill-opacity="0.9"/>
    <circle cx="9" cy="17" r="2.2" fill="#e9e3d2"/>
    <circle cx="55" cy="17" r="2.2" fill="#e9e3d2"/>
  </g>
</svg>
