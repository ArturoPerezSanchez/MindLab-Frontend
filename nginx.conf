# conf.d files are included in the http context, which is where a map has to
# live. Ordinary requests send no Upgrade header and map to "", which makes the
# proxy_set_header pair below a no-op for them.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/v1/ {
    proxy_pass http://backend:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Multiplayer rooms are a long-lived WebSocket at /api/v1/multiplayer/ws.
    # $connection_upgrade is empty for ordinary requests, so these two lines are
    # inert for the REST routes sharing this location.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
